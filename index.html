<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14070a" />
    <meta name="description" content="Taiko Thunder: a Japanese taiko-drum slot machine with a rhythm-game bonus. Play money only." />
    <title>Taiko Thunder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23b3201b'/><circle cx='50' cy='50' r='36' fill='%23f3e3bd'/><text x='50' y='54' font-size='44' text-anchor='middle' dominant-baseline='central' fill='%23b3201b'>雷</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Cinzel:wght@700;900&family=Yuji+Syuku&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>
    <nav class="sr-only" aria-label="Machine controls">
      <p id="a11y-balance"></p>
      <button id="a11y-spin">Spin</button>
      <button id="a11y-bet-down">Lower bet</button>
      <button id="a11y-bet-up">Raise bet</button>
      <button id="a11y-auto">Autoplay</button>
      <button id="a11y-turbo">Turbo</button>
      <button id="a11y-sound">Sound</button>
      <button id="a11y-info">How to play</button>
    </nav>
    <p id="live" class="sr-only" aria-live="polite"></p>
    <div id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
